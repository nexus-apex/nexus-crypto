{% extends "base.html" %}
{% block title %}{% if editing %}Edit{% else %}New{% endif %} Portfolio | NexusCrypto{% endblock %}
{% block page_title %}{% if editing %}Edit Portfolio{% else %}New Portfolio{% endif %}{% endblock %}
{% block content %}
<div class="card" style="max-width:750px">
  <form method="post">
    {% csrf_token %}
    <div class="form-row">
      <div class="form-group">
        <label>Name</label>
        <input type="text" name="name" value="{{ record.name|default:'' }}">
      </div>
      <div class="form-group">
        <label>Owner</label>
        <input type="text" name="owner" value="{{ record.owner|default:'' }}">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Total Value</label>
        <input type="number" step="0.01" name="total_value" value="{{ record.total_value|default:'0' }}">
      </div>
      <div class="form-group">
        <label>Total Invested</label>
        <input type="number" step="0.01" name="total_invested" value="{{ record.total_invested|default:'0' }}">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Pnl</label>
        <input type="number" step="0.01" name="pnl" value="{{ record.pnl|default:'0' }}">
      </div>
      <div class="form-group">
        <label>Assets Count</label>
        <input type="number" name="assets_count" value="{{ record.assets_count|default:'0' }}">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Status</label>
        <select name="status">
          <option value="active" {% if record.status == 'active' %}selected{% endif %}>Active</option>
          <option value="archived" {% if record.status == 'archived' %}selected{% endif %}>Archived</option>
        </select>
      </div>
      <div class="form-group">
        <label>Created Date</label>
        <input type="date" name="created_date" value="{{ record.created_date|date:'Y-m-d'|default:'' }}">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Currency</label>
        <select name="currency">
          <option value="usd" {% if record.currency == 'usd' %}selected{% endif %}>USD</option>
          <option value="inr" {% if record.currency == 'inr' %}selected{% endif %}>INR</option>
          <option value="eur" {% if record.currency == 'eur' %}selected{% endif %}>EUR</option>
        </select>
      </div>
    </div>

    <div style="display:flex;gap:0.75rem;margin-top:1rem">
      <button type="submit" class="btn btn-primary">{% if editing %}Update{% else %}Create{% endif %} Portfolio</button>
      <a href="/portfolios/" class="btn" style="background:var(--border);color:var(--text)">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
