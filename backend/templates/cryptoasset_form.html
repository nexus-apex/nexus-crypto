{% extends "base.html" %}
{% block title %}{% if editing %}Edit{% else %}New{% endif %} CryptoAsset | NexusCrypto{% endblock %}
{% block page_title %}{% if editing %}Edit CryptoAsset{% else %}New CryptoAsset{% endif %}{% endblock %}
{% block content %}
<div class="card" style="max-width:750px">
  <form method="post">
    {% csrf_token %}
    <div class="form-row">
      <div class="form-group">
        <label>Name</label>
        <input type="text" name="name" value="{{ record.name|default:'' }}">
      </div>
      <div class="form-group">
        <label>Symbol</label>
        <input type="text" name="symbol" value="{{ record.symbol|default:'' }}">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Portfolio Name</label>
        <input type="text" name="portfolio_name" value="{{ record.portfolio_name|default:'' }}">
      </div>
      <div class="form-group">
        <label>Quantity</label>
        <input type="number" step="0.01" name="quantity" value="{{ record.quantity|default:'0' }}">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Avg Buy Price</label>
        <input type="number" step="0.01" name="avg_buy_price" value="{{ record.avg_buy_price|default:'0' }}">
      </div>
      <div class="form-group">
        <label>Current Price</label>
        <input type="number" step="0.01" name="current_price" value="{{ record.current_price|default:'0' }}">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Value</label>
        <input type="number" step="0.01" name="value" value="{{ record.value|default:'0' }}">
      </div>
      <div class="form-group">
        <label>Pnl Percent</label>
        <input type="number" step="0.01" name="pnl_percent" value="{{ record.pnl_percent|default:'0' }}">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Exchange</label>
        <select name="exchange">
          <option value="binance" {% if record.exchange == 'binance' %}selected{% endif %}>Binance</option>
          <option value="coinbase" {% if record.exchange == 'coinbase' %}selected{% endif %}>Coinbase</option>
          <option value="wazirx" {% if record.exchange == 'wazirx' %}selected{% endif %}>WazirX</option>
          <option value="kraken" {% if record.exchange == 'kraken' %}selected{% endif %}>Kraken</option>
        </select>
      </div>
    </div>

    <div style="display:flex;gap:0.75rem;margin-top:1rem">
      <button type="submit" class="btn btn-primary">{% if editing %}Update{% else %}Create{% endif %} CryptoAsset</button>
      <a href="/cryptoassets/" class="btn" style="background:var(--border);color:var(--text)">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
